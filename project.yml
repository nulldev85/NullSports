name: NullSports
options:
  bundleIdPrefix: com.nulldev85
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.17.2"
    CURRENT_PROJECT_VERSION: "61"
packages:
  # VLCKit's official Swift Package is only published on the 4.0 alpha line
  # (still at a22, undocumented in places, and the source of two build
  # breaks tonight). This community package instead bundles VLCKit's actual
  # stable 3.6.0 release as a prebuilt xcframework for SPM.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  NullSports:
    type: application
    platform: tvOS
    sources:
      - NullSports
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports
        PRODUCT_NAME: NullSports
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NullSports
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    scheme:
      testTargets: []
  NullSportsiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NullSports/Models
      - NullSports/Services
      - NullSports/Store
      - NullSports/Design
      - NullSports/NullSportsApp.swift
      - NullSports/Views/RootView.swift
      - iPhone
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports.iOS
        PRODUCT_MODULE_NAME: NullSportsiOS
        MARKETING_VERSION: "0.17.12"
        CURRENT_PROJECT_VERSION: "71"
        PRODUCT_NAME: NullSports
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NullSports
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your IPTV provider on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - NullSportsiOSTests
  NullSportsiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/iOS
    dependencies:
      - target: NullSportsiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NullSports.app/NullSports"
        BUNDLE_LOADER: "$(TEST_HOST)"
