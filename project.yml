name: NullSports
options:
  bundleIdPrefix: com.nulldev85
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.17.1"
    CURRENT_PROJECT_VERSION: "60"
packages:
  # VLCKit's official Swift Package is only published on the 4.0 alpha line
  # (still at a22, undocumented in places, and the source of two build
  # breaks tonight). This community package instead bundles VLCKit's actual
  # stable 3.6.0 release as a prebuilt xcframework for SPM.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  NullSports:
    type: application
    platform: tvOS
    sources:
      - NullSports
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports
        PRODUCT_NAME: NullSports
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NullSports
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    scheme:
      testTargets: []
