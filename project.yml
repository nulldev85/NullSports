name: Lineup
options:
  bundleIdPrefix: com.nulldev85
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.19.0"
    CURRENT_PROJECT_VERSION: "70"
packages:
  # VLCKit's official Swift Package is only published on the 4.0 alpha line
  # (still at a22, undocumented in places, and the source of two build
  # breaks tonight). This community package instead bundles VLCKit's actual
  # stable 3.6.0 release as a prebuilt xcframework for SPM.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  # The bundle identifiers below keep the old name on purpose. iOS identifies an
  # app by that string: change it and the build becomes a separate app with an
  # empty container, so every provider, media server, favourite and saved
  # password is gone. There is no migration back -- a new container cannot read
  # the old one's defaults, and an unsigned build has no Keychain access group
  # to share. The name a person sees is set by CFBundleDisplayName instead.
  Lineup:
    type: application
    platform: tvOS
    sources:
      - Lineup
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports
        PRODUCT_NAME: Lineup
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lineup
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Lineup/Lineup.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    scheme:
      testTargets: []
  LineupiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Lineup/Models
      - Lineup/Services
      - Lineup/Store
      - Lineup/Design
      - Lineup/Resources
      - Lineup/LineupApp.swift
      - Lineup/Views/RootView.swift
      - Lineup/Views/MediaViews.swift
      - iPhone
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports.iOS
        PRODUCT_MODULE_NAME: LineupiOS
        MARKETING_VERSION: "0.19.0"
        CURRENT_PROJECT_VERSION: "82"
        PRODUCT_NAME: Lineup
        TARGETED_DEVICE_FAMILY: "1"
        # An explicit Info.plist, not INFOPLIST_KEY_* settings. UIBackgroundModes
        # must be an array of strings for iOS to grant background audio and
        # Picture in Picture; the generated plist did not produce one, so the
        # capability was silently absent. This file carries every key the
        # generated one used to, and is checked in CI after the build. It lives
        # outside `sources` on purpose: an Info.plist inside the source glob is
        # both processed and copied, which collides on Info.plist in the bundle.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BuildAssets/LineupiOS-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iPhone/LineupiOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - LineupiOSTests
  LineupiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/iOS
    dependencies:
      - target: LineupiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lineup.app/Lineup"
        BUNDLE_LOADER: "$(TEST_HOST)"
