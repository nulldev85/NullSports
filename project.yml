name: NullSports
options:
  bundleIdPrefix: com.nulldev85
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.17.1"
    CURRENT_PROJECT_VERSION: "60"
packages:
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a22
targets:
  NullSports:
    type: application
    platform: tvOS
    sources:
      - NullSports
    dependencies:
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports
        PRODUCT_NAME: NullSports
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NullSports
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    scheme:
      testTargets: []
  NullSportsiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NullSports/Models
      - NullSports/Services
      - NullSports/Store
      - NullSports/Design
      - NullSports/NullSportsApp.swift
      - NullSports/Views/RootView.swift
      - iPhone
    dependencies:
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.NullSports.iOS
        MARKETING_VERSION: "0.17.3"
        CURRENT_PROJECT_VERSION: "62"
        PRODUCT_NAME: NullSports
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NullSports
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your IPTV provider on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
