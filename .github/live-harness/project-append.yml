  # TEMPORARY design harness, appended to project.yml in CI only.
  LineupHarnessUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - LiveHarnessUITests
    dependencies:
      - target: Lineup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.LineupHarnessUITests
        TEST_TARGET_NAME: Lineup
schemes:
  LineupHarness:
    build:
      targets:
        Lineup: all
        LineupHarnessUITests: [test]
    test:
      config: Debug
      targets:
        - LineupHarnessUITests
