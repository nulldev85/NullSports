  # TEMPORARY design harness, appended to project.yml in CI only.
  StreamHarnessUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - StreamHarnessUITests
    dependencies:
      - target: Lineup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.StreamHarnessUITests
        TEST_TARGET_NAME: Lineup
  StreamHarnessiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StreamHarnessiOSUITests
    dependencies:
      - target: LineupiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nulldev85.StreamHarnessiOSUITests
        TEST_TARGET_NAME: LineupiOS
schemes:
  StreamHarness:
    build:
      targets:
        Lineup: all
        StreamHarnessUITests: [test]
    test:
      config: Debug
      targets:
        - StreamHarnessUITests
  StreamHarnessiOS:
    build:
      targets:
        LineupiOS: all
        StreamHarnessiOSUITests: [test]
    test:
      config: Debug
      targets:
        - StreamHarnessiOSUITests
