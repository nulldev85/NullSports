name: Build Lineup iPhone IPA
run-name: Build Lineup iPhone IPA · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    # Agent branches get checked against the real SDKs on every push. The class
    # of break this repo actually hits is an API that does not exist in the
    # pinned VLCKit, which nothing but a real build can catch, and waiting for
    # someone to remember to dispatch a run is how a branch sits broken.
    branches: [main, iphone, 'claude/**']

# A newer push supersedes an unfinished check on the same branch. Never cancel
# a run on main or iphone: those produce the shipping IPAs.
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/iphone' }}

jobs:
  # The simulator tests and the release build don't depend on each other, so
  # they run side by side on two runners instead of one after the other. Every
  # check and test still runs; only the waiting goes.
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Configure Library metadata services
        env:
          LINEUP_TMDB_TOKEN: ${{ secrets.LINEUP_TMDB_TOKEN }}
          LINEUP_TVDB_API_KEY: ${{ secrets.LINEUP_TVDB_API_KEY }}
          LINEUP_OPENSUBTITLES_API_KEY: ${{ secrets.LINEUP_OPENSUBTITLES_API_KEY }}
          LINEUP_FANART_API_KEY: ${{ secrets.LINEUP_FANART_API_KEY }}
        run: |
          python3 -B Tools/configure-metadata.py
          python3 -B Tools/check-metadata-bundle.py Lineup/Resources --require-online-subtitles --require-fanart
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Check Swift syntax and shared source membership
        run: |
          set -euo pipefail
          python3 -B Tests/SharedSourceMembershipChecks.py
          python3 -B Tests/MetadataBundleChecks.py
          find Lineup iPhone AetherPlayback Tests/iOS Tests/tvOS -name '*.swift' -exec xcrun swiftc -frontend -parse -swift-version 5 {} +
      - name: Check shared sports logic
        run: |
          set -euo pipefail
          python3 -B Tests/TeamDirectoryChecks.py
          python3 -B Tests/SimulatorSelectionChecks.py
          swiftc Tests/iOS/PlaybackFixtureByteRange.swift Tests/PlaybackFixtureRangeChecks.swift -o /tmp/playback-fixture-range-checks
          /tmp/playback-fixture-range-checks
          swiftc Lineup/Services/CollegeChannelMatcher.swift Tests/CollegeChannelMatcherChecks.swift -o /tmp/matcher-checks
          /tmp/matcher-checks
          swiftc Lineup/Services/DailyGameMatches.swift Tests/DailyGameMatchesChecks.swift -o /tmp/daily-checks
          /tmp/daily-checks
          swiftc Lineup/Views/GuideProgress.swift Tests/GuideProgressChecks.swift -o /tmp/guide-checks
          /tmp/guide-checks
          swiftc iPhone/MobileGuideWindow.swift Tests/MobileGuideWindowChecks.swift -o /tmp/mobile-guide-checks
          /tmp/mobile-guide-checks
          swiftc iPhone/MobilePlaybackPolicy.swift Tests/MobilePlaybackPolicyChecks.swift -o /tmp/mobile-playback-policy-checks
          /tmp/mobile-playback-policy-checks
          swiftc iPhone/MobileSubtitlePreferences.swift Tests/MobileSubtitlePreferenceChecks.swift -o /tmp/mobile-subtitle-preference-checks
          /tmp/mobile-subtitle-preference-checks
          swiftc iPhone/MobileSubtitlePreferences.swift iPhone/MobileTrackMemory.swift Tests/MobileTrackMemoryChecks.swift -o /tmp/mobile-track-memory-checks
          /tmp/mobile-track-memory-checks
          swiftc Lineup/Services/PlaybackSegments.swift Tests/MobilePlaybackSegmentChecks.swift -o /tmp/mobile-playback-segment-checks
          /tmp/mobile-playback-segment-checks
          swiftc iPhone/MobileGameStatsFeed.swift iPhone/MobileGameBoards.swift Tests/MobileGameStatsChecks.swift -o /tmp/mobile-game-stats-checks
          /tmp/mobile-game-stats-checks
          swiftc iPhone/MobileGameStatsFeed.swift iPhone/MobileGameBoards.swift Tests/MobileGameBoardChecks.swift -o /tmp/mobile-game-board-checks
          /tmp/mobile-game-board-checks
          swiftc iPhone/MobileFanartPolicy.swift Tests/MobileFanartPolicyChecks.swift -o /tmp/mobile-fanart-policy-checks
          /tmp/mobile-fanart-policy-checks
          swiftc iPhone/PlaybackDiagnosticsLog.swift Tests/PlaybackDiagnosticsLogChecks.swift -o /tmp/playback-diagnostics-checks
          /tmp/playback-diagnostics-checks
          swiftc Lineup/Services/TeamChannelPreferences.swift Tests/TeamChannelPreferenceChecks.swift -o /tmp/team-preference-checks
          /tmp/team-preference-checks
          swiftc Lineup/Services/StreamFailover.swift Lineup/Services/RecentChannels.swift Tests/StreamFailoverChecks.swift -o /tmp/stream-failover-checks
          /tmp/stream-failover-checks
      - name: Check live playback recovery and professional matchup evidence
        run: |
          set -euo pipefail
          swiftc Lineup/Services/LivePlaybackHealth.swift Tests/LivePlaybackHealthChecks.swift -o /tmp/lineup-playback-health-checks
          /tmp/lineup-playback-health-checks
          swiftc Lineup/Services/ProfessionalChannelMatcher.swift Lineup/Services/EventChannelEvidence.swift Tests/ProfessionalChannelMatcherChecks.swift -o /tmp/lineup-professional-match-checks
          /tmp/lineup-professional-match-checks
          swiftc Lineup/Services/ProviderRefreshPolicy.swift Tests/ProviderRefreshPolicyChecks.swift -o /tmp/lineup-provider-refresh-checks
          /tmp/lineup-provider-refresh-checks

      - name: Generate playback integration fixtures
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          bash Tools/make-tv-playback-fixture.sh ios

      - name: Generate project
        run: |
          set -euo pipefail
          test -d iPhone/Assets.xcassets/LineupAppIcon.appiconset
          test ! -e iPhone/Assets.xcassets/AppIcon.appiconset
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: LineupAppIcon' project.yml
          brew install xcodegen
          xcodegen generate
          python3 -B Tools/check-aether-bundle.py --project Lineup.xcodeproj/project.pbxproj
      - name: Check playback lifecycle in iPhone simulator
        run: |
          set -euo pipefail
          configuration=$(xcrun simctl list --json | python3 -B Tools/select-ios-simulator.py)
          IFS=$'\t' read -r device_type runtime <<< "$configuration"
          device=$(xcrun simctl create "Lineup-iPhone-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$device_type" "$runtime")
          cleanup_simulator() {
            xcrun simctl shutdown "$device" >/dev/null 2>&1 || true
            xcrun simctl delete "$device" >/dev/null 2>&1 || true
          }
          trap cleanup_simulator EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "Testing on a fresh simulator: $device_type / $runtime"
          xcodebuild test -project Lineup.xcodeproj -scheme LineupiOS \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -parallel-testing-enabled NO \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD
      - name: Export navigation preview screenshots
        if: always()
        run: |
          result=$(find build-tests/Logs/Test -maxdepth 1 -name '*.xcresult' -print -quit 2>/dev/null || true)
          if [ -n "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path navigation-previews || echo "::warning::Could not export test screenshots"
          fi
      - name: Upload navigation previews
        if: always()
        # Supplementary previews must not prevent the release build/package.
        # Simulator tests and the installable IPA upload remain mandatory.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Lineup-iPhone-navigation-previews
          path: navigation-previews
          if-no-files-found: ignore
          retention-days: 3
      - name: Check Inter is bundled
        run: |
          set -euo pipefail
          # The font is registered at launch from the bundle, and a missing
          # file is silent: Font.custom falls back to the system font and the
          # app looks the way it did before Inter. So the bundle is the thing
          # to check, not the code.
          # Run on the simulator bundle here and on the release bundle in the
          # package job: a branch that stops after the tests still gets this
          # check, and it is the check that has already caught a capability
          # silently missing from a shipped build.
          app="build-tests/Build/Products/Debug-iphonesimulator/Lineup.app"
          test -d "$app"
          python3 -B Tools/check-metadata-bundle.py "$app" --require-online-subtitles --require-fanart
          missing=0
          for face in Light Regular Medium SemiBold Bold ExtraBold Black; do
            if ! find "$app" -name "Inter-$face.ttf" | grep -q .; then
              echo "Inter-$face.ttf is not in the app bundle"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Check background audio capability is in the bundle
        run: |
          set -euo pipefail
          # The capability that makes background playback and Picture in Picture
          # work at all. It is silent when missing -- the app simply stops on
          # background -- and it lives in the built plist, not in code, so the
          # bundle is the thing to check.
          # Run on the simulator bundle here and on the release bundle in the
          # package job: a branch that stops after the tests still gets this
          # check, and it is the check that has already caught a capability
          # silently missing from a shipped build.
          app="build-tests/Build/Products/Debug-iphonesimulator/Lineup.app"
          plist="$app/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$plist" | grep -qx audio
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" != ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.nulldev85.NullSports.iOS"
          icons=$(find "$app" -maxdepth 1 -name 'LineupAppIcon*.png')
          test -n "$icons"
          legacy_icons=$(find "$app" -maxdepth 1 -name 'AppIcon*.png')
          test -z "$legacy_icons"

      - name: Check AetherEngine linkage, resources, and iOS minimum
        run: |
          set -euo pipefail
          app="build-tests/Build/Products/Debug-iphonesimulator/Lineup.app"
          python3 -B Tests/AetherBundleChecks.py
          python3 Tools/check-aether-bundle.py "$app"


  package:
    # Packaging an installable build is for the shipping branches and for
    # anyone who asks for one by hand. Every other branch stops after the
    # tests, so a check costs a fraction of the runner time.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/iphone' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Configure Library metadata services
        env:
          LINEUP_TMDB_TOKEN: ${{ secrets.LINEUP_TMDB_TOKEN }}
          LINEUP_TVDB_API_KEY: ${{ secrets.LINEUP_TVDB_API_KEY }}
          LINEUP_OPENSUBTITLES_API_KEY: ${{ secrets.LINEUP_OPENSUBTITLES_API_KEY }}
          LINEUP_FANART_API_KEY: ${{ secrets.LINEUP_FANART_API_KEY }}
        run: |
          python3 -B Tools/configure-metadata.py
          python3 -B Tools/check-metadata-bundle.py Lineup/Resources --require-online-subtitles --require-fanart
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Generate project
        run: |
          set -euo pipefail
          test -d iPhone/Assets.xcassets/LineupAppIcon.appiconset
          test ! -e iPhone/Assets.xcassets/AppIcon.appiconset
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: LineupAppIcon' project.yml
          brew install xcodegen
          xcodegen generate
          python3 -B Tools/check-aether-bundle.py --project Lineup.xcodeproj/project.pbxproj
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project Lineup.xcodeproj -scheme LineupiOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD
      - name: Check Inter is bundled
        run: |
          set -euo pipefail
          # The font is registered at launch from the bundle, and a missing
          # file is silent: Font.custom falls back to the system font and the
          # app looks the way it did before Inter. So the bundle is the thing
          # to check, not the code.
          # The bundle that ships, checked as it is packaged.
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          test -d "$app"
          python3 -B Tools/check-metadata-bundle.py "$app" --require-online-subtitles --require-fanart
          missing=0
          for face in Light Regular Medium SemiBold Bold ExtraBold Black; do
            if ! find "$app" -name "Inter-$face.ttf" | grep -q .; then
              echo "Inter-$face.ttf is not in the app bundle"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Check background audio capability is in the bundle
        run: |
          set -euo pipefail
          # The capability that makes background playback and Picture in Picture
          # work at all. It is silent when missing -- the app simply stops on
          # background -- and it lives in the built plist, not in code, so the
          # bundle is the thing to check.
          # The bundle that ships, checked as it is packaged.
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          plist="$app/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$plist" | grep -qx audio
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" != ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.nulldev85.NullSports.iOS"
          icons=$(find "$app" -maxdepth 1 -name 'LineupAppIcon*.png')
          test -n "$icons"
          legacy_icons=$(find "$app" -maxdepth 1 -name 'AppIcon*.png')
          test -z "$legacy_icons"

      - name: Check AetherEngine linkage, resources, and iOS minimum
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          python3 -B Tests/AetherBundleChecks.py
          python3 Tools/check-aether-bundle.py "$app"

      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          test -d "$app"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../Lineup-iPhone-unsigned.ipa Payload
      - name: Upload IPA for the tests to clear
        uses: actions/upload-artifact@v4
        with:
          name: Lineup-iPhone-unsigned-IPA-candidate
          path: Lineup-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 1

  # The installable build is published only once the tests have passed, as
  # it was when one job did both in turn. The candidate is renamed, not
  # rebuilt, so what is published is exactly what the package job built.
  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish IPA
        uses: actions/upload-artifact/merge@v4
        with:
          name: Lineup-iPhone-unsigned-IPA
          pattern: Lineup-iPhone-unsigned-IPA-candidate
          delete-merged: true
          retention-days: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/iphone') && 14 || 7 }}
