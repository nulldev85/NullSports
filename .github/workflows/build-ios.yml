name: Build Lineup iPhone IPA
run-name: Build Lineup iPhone IPA · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    # Agent branches get checked against the real SDKs on every push. The class
    # of break this repo actually hits is an API that does not exist in the
    # pinned VLCKit, which nothing but a real build can catch, and waiting for
    # someone to remember to dispatch a run is how a branch sits broken.
    branches: [iphone, 'claude/**']

# A newer push supersedes an unfinished check on the same branch. Never cancel
# a run on iphone: that one is producing an IPA someone is waiting for.
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/iphone' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Packaging an installable build is for the shipping branch and for
      # anyone who asks for one by hand. Every other branch stops after the
      # tests, so a check costs a fraction of the runner time.
      PACKAGES_IPA: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/iphone' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check shared sports logic
        run: |
          set -euo pipefail
          swiftc Lineup/Services/CollegeChannelMatcher.swift Tests/CollegeChannelMatcherChecks.swift -o /tmp/matcher-checks
          /tmp/matcher-checks
          swiftc Lineup/Services/DailyGameMatches.swift Tests/DailyGameMatchesChecks.swift -o /tmp/daily-checks
          /tmp/daily-checks
          swiftc Lineup/Views/GuideProgress.swift Tests/GuideProgressChecks.swift -o /tmp/guide-checks
          /tmp/guide-checks
          swiftc iPhone/MobileGuideWindow.swift Tests/MobileGuideWindowChecks.swift -o /tmp/mobile-guide-checks
          /tmp/mobile-guide-checks
          swiftc iPhone/MobilePlaybackPolicy.swift Tests/MobilePlaybackPolicyChecks.swift -o /tmp/mobile-playback-policy-checks
          /tmp/mobile-playback-policy-checks
          swiftc iPhone/PlaybackDiagnosticsLog.swift Tests/PlaybackDiagnosticsLogChecks.swift -o /tmp/playback-diagnostics-checks
          /tmp/playback-diagnostics-checks
          swiftc Lineup/Services/TeamChannelPreferences.swift Tests/TeamChannelPreferenceChecks.swift -o /tmp/team-preference-checks
          /tmp/team-preference-checks
          swiftc Lineup/Services/StreamFailover.swift Lineup/Services/RecentChannels.swift Tests/StreamFailoverChecks.swift -o /tmp/stream-failover-checks
          /tmp/stream-failover-checks
          swiftc Lineup/Models/OnDemandModels.swift Lineup/Services/OnDemandProgress.swift Tests/OnDemandChecks.swift -o /tmp/on-demand-checks
          /tmp/on-demand-checks
      - name: Check live playback recovery and professional matchup evidence
        run: |
          set -euo pipefail
          swiftc Lineup/Services/LivePlaybackHealth.swift Tests/LivePlaybackHealthChecks.swift -o /tmp/lineup-playback-health-checks
          /tmp/lineup-playback-health-checks
          swiftc Lineup/Services/ProfessionalChannelMatcher.swift Tests/ProfessionalChannelMatcherChecks.swift -o /tmp/lineup-professional-match-checks
          /tmp/lineup-professional-match-checks
          swiftc Lineup/Services/ProviderRefreshPolicy.swift Tests/ProviderRefreshPolicyChecks.swift -o /tmp/lineup-provider-refresh-checks
          /tmp/lineup-provider-refresh-checks

      - name: Generate project
        run: |
          set -euo pipefail
          test -d iPhone/Assets.xcassets/LineupAppIcon.appiconset
          test ! -e iPhone/Assets.xcassets/AppIcon.appiconset
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: LineupAppIcon' project.yml
          brew install xcodegen
          xcodegen generate
      - name: Check playback lifecycle in iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          xcodebuild test -project Lineup.xcodeproj -scheme LineupiOS \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD
      - name: Build unsigned iPhone app
        if: env.PACKAGES_IPA == 'true'
        run: |
          set -euo pipefail
          xcodebuild -project Lineup.xcodeproj -scheme LineupiOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD
      - name: Check Inter is bundled
        run: |
          set -euo pipefail
          # The font is registered at launch from the bundle, and a missing
          # file is silent: Font.custom falls back to the system font and the
          # app looks the way it did before Inter. So the bundle is the thing
          # to check, not the code.
          # The release bundle where one was built, the simulator bundle
          # otherwise: a branch that stops after the tests still gets this
          # check, and it is the check that has already caught a capability
          # silently missing from a shipped build.
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          [ -d "$app" ] || app="build-tests/Build/Products/Debug-iphonesimulator/Lineup.app"
          test -d "$app"
          missing=0
          for face in Light Regular Medium SemiBold Bold ExtraBold Black; do
            if ! find "$app" -name "Inter-$face.ttf" | grep -q .; then
              echo "Inter-$face.ttf is not in the app bundle"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Check background audio capability is in the bundle
        run: |
          set -euo pipefail
          # The capability that makes background playback and Picture in Picture
          # work at all. It is silent when missing -- the app simply stops on
          # background -- and it lives in the built plist, not in code, so the
          # bundle is the thing to check.
          # The release bundle where one was built, the simulator bundle
          # otherwise: a branch that stops after the tests still gets this
          # check, and it is the check that has already caught a capability
          # silently missing from a shipped build.
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          [ -d "$app" ] || app="build-tests/Build/Products/Debug-iphonesimulator/Lineup.app"
          plist="$app/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$plist" | grep -qx audio
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" != ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.nulldev85.NullSports.iOS"
          icons=$(find "$app" -maxdepth 1 -name 'LineupAppIcon*.png')
          test -n "$icons"
          legacy_icons=$(find "$app" -maxdepth 1 -name 'AppIcon*.png')
          test -z "$legacy_icons"

      - name: Package IPA
        if: env.PACKAGES_IPA == 'true'
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/Lineup.app"
          test -d "$app"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../Lineup-iPhone-unsigned.ipa Payload
      - name: Upload IPA
        if: env.PACKAGES_IPA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lineup-iPhone-unsigned-IPA
          path: Lineup-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
