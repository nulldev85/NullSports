name: Build NullSports iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [iphone]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check shared sports logic
        run: |
          set -euo pipefail
          swiftc NullSports/Services/CollegeChannelMatcher.swift Tests/CollegeChannelMatcherChecks.swift -o /tmp/matcher-checks
          /tmp/matcher-checks
          swiftc NullSports/Services/DailyGameMatches.swift Tests/DailyGameMatchesChecks.swift -o /tmp/daily-checks
          /tmp/daily-checks
          swiftc NullSports/Views/GuideProgress.swift Tests/GuideProgressChecks.swift -o /tmp/guide-checks
          /tmp/guide-checks
          swiftc iPhone/MobileGuideWindow.swift Tests/MobileGuideWindowChecks.swift -o /tmp/mobile-guide-checks
          /tmp/mobile-guide-checks
      - name: Check live playback recovery and professional matchup evidence
        run: |
          set -euo pipefail
          swiftc NullSports/Services/LivePlaybackHealth.swift Tests/LivePlaybackHealthChecks.swift -o /tmp/nullsports-playback-health-checks
          /tmp/nullsports-playback-health-checks
          swiftc NullSports/Services/ProfessionalChannelMatcher.swift Tests/ProfessionalChannelMatcherChecks.swift -o /tmp/nullsports-professional-match-checks
          /tmp/nullsports-professional-match-checks

      - name: Generate project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Check playback lifecycle in iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          xcodebuild test -project NullSports.xcodeproj -scheme NullSportsiOS \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project NullSports.xcodeproj -scheme NullSportsiOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/NullSports.app"
          test -d "$app"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../NullSports-iPhone-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NullSports-iPhone-unsigned-IPA
          path: NullSports-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
