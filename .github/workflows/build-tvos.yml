name: Build NullSports tvOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install project generator
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          assets='NullSports/Assets.xcassets/App Icon & Top Shelf Image.brandassets'
          source='BuildAssets/NullSportsMark.png'
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAANSURBVBhXY+Dk4vwPAAFYARw5ahBmAAAAAElFTkSuQmCC' | base64 --decode > background.png
          sips -z 240 240 "$source" --out "$assets/App Icon - Small.imagestack/Foreground.imagestacklayer/Content.imageset/Foreground.png" >/dev/null
          sips -z 480 480 "$source" --out "$assets/App Icon - Small.imagestack/Foreground.imagestacklayer/Content.imageset/Foreground@2x.png" >/dev/null
          sips -z 768 768 "$source" --out "$assets/App Icon - Large.imagestack/Foreground.imagestacklayer/Content.imageset/Foreground.png" >/dev/null
          sips -z 240 400 background.png --out "$assets/App Icon - Small.imagestack/Background.imagestacklayer/Content.imageset/Background.png" >/dev/null
          sips -z 480 800 background.png --out "$assets/App Icon - Small.imagestack/Background.imagestacklayer/Content.imageset/Background@2x.png" >/dev/null
          sips -z 768 1280 background.png --out "$assets/App Icon - Large.imagestack/Background.imagestacklayer/Content.imageset/Background.png" >/dev/null
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NullSports.xcodeproj \
            -scheme NullSports \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-appletvos/NullSports.app"
          test -d "$app"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../NullSports-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NullSports-tvOS-unsigned-IPA
          path: NullSports-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
