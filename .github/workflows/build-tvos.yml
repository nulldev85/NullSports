name: Build NullSports tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check college channel matching policy
        run: |
          set -euo pipefail
          swiftc NullSports/Services/CollegeChannelMatcher.swift Tests/CollegeChannelMatcherChecks.swift -o /tmp/nullsports-matcher-checks
          /tmp/nullsports-matcher-checks

      - name: Check Guide elapsed progress
        run: |
          set -euo pipefail
          swiftc NullSports/Views/GuideProgress.swift Tests/GuideProgressChecks.swift -o /tmp/nullsports-guide-checks
          /tmp/nullsports-guide-checks

      - name: Check daily schedule and match persistence
        run: |
          set -euo pipefail
          swiftc NullSports/Services/DailyGameMatches.swift Tests/DailyGameMatchesChecks.swift -o /tmp/nullsports-daily-cache-checks
          /tmp/nullsports-daily-cache-checks

      - name: Install project generator
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          bash BuildAssets/generate-icons.sh
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NullSports.xcodeproj \
            -scheme NullSports \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for tvOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project NullSports.xcodeproj \
            -scheme NullSports \
            -configuration Debug \
            -destination 'platform=tvOS Simulator,name=Apple TV' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Smoke test app launch in tvOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "Apple TV" in v["name"]))')
          xcrun simctl boot "$device"
          app="build-sim/Build/Products/Debug-appletvsimulator/NullSports.app"
          test -d "$app"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.nulldev85.NullSports
          # Give the app a few seconds to finish launching, then confirm it's
          # still alive rather than having crashed on a VLCKit link/runtime error.
          sleep 6
          if ! xcrun simctl spawn "$device" launchctl list | grep -q com.nulldev85.NullSports; then
            echo "App did not stay running after launch — collecting crash logs"
            xcrun simctl spawn "$device" log show --predicate 'process == "NullSports"' --last 2m || true
            exit 1
          fi
          xcrun simctl shutdown "$device"

      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-appletvos/NullSports.app"
          test -d "$app"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../NullSports-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NullSports-tvOS-unsigned-IPA
          path: NullSports-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
