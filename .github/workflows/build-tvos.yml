name: Build Lineup tvOS IPA
run-name: Build Lineup tvOS IPA · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    # An agent branch push only compiles (the compile job below); main builds,
    # tests and publishes the official IPA.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  # Agent branches change code both apps share, and nothing else built the
  # Apple TV app before a merge, so a shared change could break it unseen. This
  # compiles the app and its tests for the simulator on every agent push,
  # without running or packaging anything. A newer push replaces an unfinished
  # check on the same branch.
  compile:
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: build-tvos-compile-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Configure Library metadata services
        env:
          LINEUP_TMDB_TOKEN: ${{ secrets.LINEUP_TMDB_TOKEN }}
          LINEUP_TVDB_API_KEY: ${{ secrets.LINEUP_TVDB_API_KEY }}
          LINEUP_OPENSUBTITLES_API_KEY: ${{ secrets.LINEUP_OPENSUBTITLES_API_KEY }}
          LINEUP_FANART_API_KEY: ${{ secrets.LINEUP_FANART_API_KEY }}
        run: python3 -B Tools/configure-metadata.py
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile the app and its tests
        run: |
          set -euo pipefail
          # A real simulator, as the full build's tests use, so only its own
          # architecture is built: LibDovi ships no Intel simulator slice, so
          # the generic simulator destination cannot link AetherEngine.
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "Apple TV" in v["name"]))')
          xcodebuild \
            -project Lineup.xcodeproj \
            -scheme Lineup \
            -configuration Debug \
            -destination "platform=tvOS Simulator,id=$device" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD \
            build-for-testing

  build:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    # AetherEngine 7.45.0 is built and tested with Swift 6.4 / Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Configure Library metadata services
        env:
          LINEUP_TMDB_TOKEN: ${{ secrets.LINEUP_TMDB_TOKEN }}
          LINEUP_TVDB_API_KEY: ${{ secrets.LINEUP_TVDB_API_KEY }}
          # Title logos and Find Subtitles Online, on the television as on
          # the phone.
          LINEUP_OPENSUBTITLES_API_KEY: ${{ secrets.LINEUP_OPENSUBTITLES_API_KEY }}
          LINEUP_FANART_API_KEY: ${{ secrets.LINEUP_FANART_API_KEY }}
        run: |
          python3 -B Tools/configure-metadata.py
          python3 -B Tools/check-metadata-bundle.py Lineup/Resources --require-online-subtitles --require-fanart --require-tmdb

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Check Swift syntax and shared source membership
        run: |
          set -euo pipefail
          python3 -B Tests/SharedSourceMembershipChecks.py
          python3 -B Tests/PlaybackBundleProjectChecks.py
          python3 -B Tests/PlaybackVersionChecks.py
          find Lineup iPhone AetherPlayback MPVPlayback Tests/iOS Tests/tvOS -name '*.swift' -exec xcrun swiftc -frontend -parse -swift-version 5 {} +

      - name: Check college channel matching policy
        run: |
          set -euo pipefail
          python3 -B Tests/TeamDirectoryChecks.py
          swiftc Lineup/Services/CollegeChannelMatcher.swift Tests/CollegeChannelMatcherChecks.swift -o /tmp/lineup-matcher-checks
          /tmp/lineup-matcher-checks

      - name: Check Guide elapsed progress
        run: |
          set -euo pipefail
          swiftc Lineup/Views/GuideProgress.swift Tests/GuideProgressChecks.swift -o /tmp/lineup-guide-checks
          /tmp/lineup-guide-checks

      - name: Check daily schedule and match persistence
        run: |
          set -euo pipefail
          swiftc Lineup/Services/DailyGameMatches.swift Tests/DailyGameMatchesChecks.swift -o /tmp/lineup-daily-cache-checks
          /tmp/lineup-daily-cache-checks

      - name: Check live stats, Auto Sync, team pages, title logos and track memory
        run: |
          set -euo pipefail
          swiftc Lineup/Services/GameStatsFeed.swift Lineup/Services/GameStatsBoards.swift Tests/MobileGameStatsChecks.swift -o /tmp/lineup-game-stats-checks
          /tmp/lineup-game-stats-checks
          swiftc Lineup/Services/GameStatsFeed.swift Lineup/Services/GameStatsBoards.swift Tests/MobileGameBoardChecks.swift -o /tmp/lineup-game-board-checks
          /tmp/lineup-game-board-checks
          swiftc Lineup/Services/AutoSyncLogic.swift Tests/MobileAutoSyncChecks.swift -o /tmp/lineup-auto-sync-checks
          /tmp/lineup-auto-sync-checks
          swiftc Lineup/Services/TeamPageFeed.swift Tests/MobileTeamPageChecks.swift -o /tmp/lineup-team-page-checks
          /tmp/lineup-team-page-checks
          swiftc Lineup/Services/FanartPolicy.swift Tests/MobileFanartPolicyChecks.swift -o /tmp/lineup-fanart-policy-checks
          /tmp/lineup-fanart-policy-checks
          swiftc Lineup/Services/SubtitlePreferences.swift Tests/MobileSubtitlePreferenceChecks.swift -o /tmp/lineup-subtitle-preference-checks
          /tmp/lineup-subtitle-preference-checks
          swiftc Lineup/Services/SubtitlePreferences.swift Lineup/Services/TrackMemory.swift Tests/MobileTrackMemoryChecks.swift -o /tmp/lineup-track-memory-checks
          /tmp/lineup-track-memory-checks

      - name: Install project generator
        run: brew install xcodegen

      - name: Check live playback recovery and professional matchup evidence
        run: |
          set -euo pipefail
          swiftc Lineup/Services/LivePlaybackHealth.swift Tests/LivePlaybackHealthChecks.swift -o /tmp/lineup-playback-health-checks
          /tmp/lineup-playback-health-checks
          swiftc Lineup/Services/ProfessionalChannelMatcher.swift Lineup/Services/EventChannelEvidence.swift Tests/ProfessionalChannelMatcherChecks.swift -o /tmp/lineup-professional-match-checks
          /tmp/lineup-professional-match-checks
          swiftc Lineup/Services/ProviderRefreshPolicy.swift Tests/ProviderRefreshPolicyChecks.swift -o /tmp/lineup-provider-refresh-checks
          /tmp/lineup-provider-refresh-checks

      - name: Check tvOS focus styling
        run: |
          set -euo pipefail
          python3 Tools/check-tv-focus.py

      - name: Generate playback integration fixture
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          bash Tools/make-tv-playback-fixture.sh

      # The icon layers are committed artwork. They used to be rebuilt here from
      # a source bitmap on every run, which meant a new icon was overwritten by
      # the old one before it ever reached a build. BuildAssets/package-play-icon.ps1
      # packages the approved masters when the artwork itself changes.
      - name: Generate project
        run: |
          set -euo pipefail
          test -d 'Lineup/Assets.xcassets/Lineup App Icon & Top Shelf Image.brandassets'
          test ! -e 'Lineup/Assets.xcassets/App Icon & Top Shelf Image.brandassets'
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: "Lineup App Icon & Top Shelf Image"' project.yml
          xcodegen generate
          python3 -B Tools/check-aether-bundle.py --project Lineup.xcodeproj/project.pbxproj

      - name: Build unsigned app
        env:
          # Every build gets a number of its own, so a release is never offered
          # under the number of the one before it. project.yml's number is for
          # builds made outside CI.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project Lineup.xcodeproj \
            -scheme Lineup \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Build/Products/Release-appletvos/Lineup.app/Info.plist)" = "$BUILD_NUMBER"

      - name: Check metadata is bundled
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-appletvos/Lineup.app"
          test -d "$app"
          python3 -B Tools/check-metadata-bundle.py "$app" --require-online-subtitles --require-fanart --require-tmdb

      - name: Check App Transport Security is in the bundle
        run: |
          set -euo pipefail
          # It reached the built app through a build setting that does not
          # exist, so it never reached it at all: a nested dictionary has no
          # INFOPLIST_KEY_ form and Xcode silently ignores one. Nothing in the
          # source says whether it survived, so read it back out of the bundle.
          plist="build/Build/Products/Release-appletvos/Lineup.app/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$plist" | grep -qx true
          # The generated keys have to survive the merge with that file.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Lineup"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.nulldev85.NullSports"

      - name: Check AetherEngine isolation and packaged dependencies
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-appletvos/Lineup.app"
          python3 -B Tests/AetherBundleChecks.py
          python3 Tools/check-aether-bundle.py "$app"

      - name: Run tvOS playback and Library regression tests
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "Apple TV" in v["name"]))')
          xcodebuild \
            -project Lineup.xcodeproj \
            -scheme Lineup \
            -configuration Debug \
            -destination "platform=tvOS Simulator,id=$device" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD \
            test

      - name: Export playback proof screenshots
        if: always()
        run: |
          result=$(find build-sim/Logs/Test -maxdepth 1 -name '*.xcresult' -print -quit 2>/dev/null || true)
          if [ -n "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path playback-previews || echo "::warning::Could not export playback screenshots"
          fi

      - name: Upload playback proof screenshots
        if: always()
        # Screenshots are supplementary. A storage/upload outage must not stop
        # the launch smoke test or IPA packaging; tests and IPA upload still fail.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Lineup-tvOS-playback-previews
          path: playback-previews
          if-no-files-found: ignore
          retention-days: 3

      - name: Smoke test app launch in tvOS Simulator
        run: |
          set -euo pipefail
          read -r device device_state < <(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); v=next(v for devices in d["devices"].values() for v in devices if "Apple TV" in v["name"]); print(v["udid"], v["state"])')
          if [ "$device_state" != "Booted" ]; then xcrun simctl boot "$device"; fi
          # `simctl boot` returns once booting has started, not once FrontBoard
          # is ready to discover and launch installed apps. Wait for the
          # television home screen instead of racing it on a busy runner.
          xcrun simctl bootstatus "$device" -b
          app="build-sim/Build/Products/Debug-appletvsimulator/Lineup.app"
          test -d "$app"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.nulldev85.NullSports
          # Give the app a few seconds to finish launching, then confirm it's
          # still alive rather than having crashed on a VLCKit link/runtime error.
          sleep 6
          # Capture the complete list before searching it. With pipefail enabled,
          # grep -q exits as soon as it finds the app and can leave launchctl with
          # SIGPIPE, incorrectly failing an otherwise successful smoke test.
          processes=$(xcrun simctl spawn "$device" launchctl list)
          if ! grep -q com.nulldev85.NullSports <<< "$processes"; then
            echo "App did not stay running after launch — collecting crash logs"
            xcrun simctl spawn "$device" log show --predicate 'process == "Lineup"' --last 2m || true
            exit 1
          fi
          xcrun simctl shutdown "$device"

      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-appletvos/Lineup.app"
          test -d "$app"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../Lineup-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Lineup-tvOS-unsigned-IPA
          path: Lineup-unsigned.ipa
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 7 }}

  source-release:
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified IPA
        uses: actions/download-artifact@v6
        with:
          name: Lineup-tvOS-unsigned-IPA
          path: release

      - name: Read and validate IPA metadata
        env:
          IPA: release/Lineup-unsigned.ipa
        run: |
          python3 - "$IPA" "$RUNNER_TEMP/source-release-notes.md" <<'PY'
          import os
          import plistlib
          import sys
          import zipfile

          ipa_path, notes_path = sys.argv[1:]
          with zipfile.ZipFile(ipa_path) as archive:
              plist = plistlib.loads(archive.read("Payload/Lineup.app/Info.plist"))
          bundle_id = plist["CFBundleIdentifier"]
          if bundle_id != "com.nulldev85.NullSports":
              raise SystemExit(f"Unexpected bundle identifier: {bundle_id}")
          fields = {
              "Source-App": "Lineup tvOS",
              "Source-Bundle-Identifier": bundle_id,
              "Source-Version": plist["CFBundleShortVersionString"],
              "Source-Build-Version": plist["CFBundleVersion"],
              "Source-Minimum-OS-Version": plist.get("MinimumOSVersion", "") or "unknown",
              "Source-Branch": "main",
              "Source-SHA": os.environ["GITHUB_SHA"],
          }
          with open(notes_path, "w", encoding="utf-8") as notes:
              for key, value in fields.items():
                  notes.write(f"{key}: {value}\n")
          PY

      - name: Publish public source release from main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: source-tvos-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          version=$(sed -n 's/^Source-Version: //p' "$RUNNER_TEMP/source-release-notes.md")
          build=$(sed -n 's/^Source-Build-Version: //p' "$RUNNER_TEMP/source-release-notes.md")
          mv release/Lineup-unsigned.ipa release/Lineup-tvOS-unsigned.ipa
          gh release create "$SOURCE_TAG" "release/Lineup-tvOS-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lineup tvOS $version ($build)" \
            --notes-file "$RUNNER_TEMP/source-release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false
