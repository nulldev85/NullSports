name: Build Forge iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Forge/**"
      - ".github/workflows/build-forge.yml"
  pull_request:
    paths:
      - "Forge/**"
      - ".github/workflows/build-forge.yml"

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Run core tests
        working-directory: Forge
        run: swift test

  app:
    name: Build, UI test and package
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Forge
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Core tests (macOS)
        run: swift test

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set +e
          mkdir -p build
          # Each CI run gets its own build number, so the app can tell an
          # update apart and snapshot the data before the new build runs.
          xcodebuild -project Forge.xcodeproj -scheme Forge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build \
            > build/device-build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build/device-build.log | sort -u | head -150
          exit $status

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          app="build/device/Build/Products/Release-iphoneos/Forge.app"
          test -f "$app/exercises.json"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$app/Info.plist" | grep -q audio
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$app/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist" | grep -qx "${{ github.run_number }}"

      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/device/Build/Products/Release-iphoneos/Forge.app"
          rm -rf build/package && mkdir -p build/package/Payload
          cp -R "$app" build/package/Payload/
          (cd build/package && zip -qry ../../Forge-unsigned.ipa Payload)
          ls -lh Forge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Forge-iPhone-unsigned-IPA
          path: Forge/Forge-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: UI tests in simulator
        id: uitests
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")]
          preferred = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]] or phones
          print(preferred[-1]["udid"])
          ')
          echo "Using simulator $device"
          echo "SIM_DEVICE=$device" >> "$GITHUB_ENV"
          # Boot fully before testing; launching into a simulator that is
          # still starting up can time out.
          xcrun simctl bootstatus "$device" -b
          set +e
          xcodebuild test -project Forge.xcodeproj -scheme Forge \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build/sim -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/uitest.log 2>&1
          status=$?
          grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|XCTAssert" build/uitest.log | head -150
          exit $status

      - name: Main-thread stall report
        if: always()
        run: |
          set -uo pipefail
          container=$(xcrun simctl get_app_container "${SIM_DEVICE:-booted}" com.nulldev85.Forge data 2>/dev/null || true)
          log="$container/Library/Caches/forge-stalls.log"
          if [ -z "$container" ] || [ ! -f "$log" ]; then
            echo "No stall log found (container: $container)"
            exit 0
          fi
          cp "$log" build/stalls.log
          python3 - <<'PY' || echo "stall report failed"
          import glob, os, platform, re, subprocess
          from collections import defaultdict

          stalls = []  # [ms, at, screen, test, {sample_ms: [(image, base, addr, symbol)]}]
          test = "run"
          for line in open("build/stalls.log").read().splitlines():
              if line.startswith("=== launch "):
                  test = " ".join(line.split()[2:-1])
                  continue
              m = re.match(r"stall\s+(\d+) ms\s+at\s+([\d.]+) s\s+(.*)", line)
              if m:
                  stalls.append([int(m.group(1)), float(m.group(2)), m.group(3).strip(), test, {}])
                  continue
              m = re.match(r"\s+@(\d+) (\S+) 0x([0-9a-f]+) 0x([0-9a-f]+)(?: (.*))?$", line)
              if m and stalls:
                  frames = stalls[-1][4].setdefault(int(m.group(1)), [])
                  frames.append((m.group(2), int(m.group(3), 16), int(m.group(4), 16), m.group(5) or ""))

          print(f"{len(stalls)} main-thread stalls of 48 ms or more")
          if not stalls:
              raise SystemExit(0)
          total = sum(s[0] for s in stalls)
          print(f"total {total} ms, worst {max(s[0] for s in stalls)} ms, over 100 ms: {sum(1 for s in stalls if s[0] >= 100)}")
          by_screen = {}
          for ms, at, screen, t, _ in stalls:
              entry = by_screen.setdefault(screen, [0, 0, 0])
              entry[0] += 1; entry[1] += ms; entry[2] = max(entry[2], ms)
          print("by screen (count, total ms, worst ms):")
          for screen, (count, total_ms, worst) in sorted(by_screen.items(), key=lambda kv: -kv[1][1]):
              print(f"  {screen:<22} {count:>3} {total_ms:>6} {worst:>5}")
          print("every stall:")
          for ms, at, screen, t, _ in stalls:
              print(f"  {ms:>5} ms  {at:>7.2f} s  {screen:<22} {t}")

          # Name the app's own frames with atos (the build's symbols), and
          # demangle everything else.
          apps = glob.glob("build/sim/Build/Products/*-iphonesimulator/Forge.app")
          arch = platform.machine()
          names = {}
          wanted = defaultdict(set)
          for s in stalls:
              for frames in s[4].values():
                  for image, base, addr, symbol in frames:
                      if image.startswith("Forge"):
                          wanted[(image, base)].add(addr)
          for (image, base), addrs in wanted.items():
              binary = os.path.join(apps[0], image) if apps else ""
              if not os.path.exists(binary):
                  continue
              addrs = sorted(addrs)
              for i in range(0, len(addrs), 400):
                  chunk = addrs[i:i + 400]
                  try:
                      out = subprocess.run(["xcrun", "atos", "-o", binary, "-arch", arch, "-l", hex(base)] + [hex(a) for a in chunk],
                                           capture_output=True, text=True, timeout=180).stdout.splitlines()
                  except Exception as error:
                      print("atos failed:", error)
                      break
                  for addr, text in zip(chunk, out):
                      names[addr] = re.sub(r" \(in [^)]*\)", "", text.strip())
          mangled = sorted({f[3] for s in stalls for frames in s[4].values() for f in frames if f[3].startswith(("$s", "_$s"))})
          demangled = {}
          if mangled:
              try:
                  out = subprocess.run(["xcrun", "swift-demangle", "--simplified", "--compact"], input="\n".join(mangled) + "\n",
                                       capture_output=True, text=True, timeout=180).stdout.splitlines()
                  demangled = dict(zip(mangled, out))
              except Exception as error:
                  print("swift-demangle failed:", error)

          def name(frame):
              image, base, addr, symbol = frame
              if addr in names:
                  return names[addr]
              return demangled.get(symbol, symbol) or hex(addr)

          # Frames every main-thread stack has (the app's entry point) or
          # that only hand SwiftUI the app's view types don't count as app work.
          SKIP = re.compile(r"\$main|entry_point|^main\b|protocol witness for static View\._make")
          def app_frames(frames):
              return [f for f in frames if f[0].startswith("Forge") and not SKIP.search(name(f))]
          RUNTIME = ("conformsToProtocol", "GenericMetadata", "DynamicPropertyCache", "_checkGenericRequirements",
                     "TypeByMangledName", "WitnessTable", "metadata accessor", "metadata completion", "MetadataCache")
          def cause(s):
              samples = [frames for frames in s[4].values() if frames]
              if not samples:
                  return "no stack"
              images = {f[0] for frames in samples for f in frames}
              names_ = [name(f) for frames in samples for f in frames]
              if any(image.startswith(("XCT", "libXCT")) for image in images):
                  return "UI test harness (XCUITest query)"
              if any("sqlite" in image for image in images):
                  return "database"
              if any(a in image for image in images for a in ("AVFAudio", "AudioToolbox", "TextToSpeech", "MediaExperience")):
                  return "audio"
              if any("Keyboard" in n for n in names_):
                  return "keyboard (system)"
              if any(a in image for image in images for a in ("Accessibility", "AXRuntime", "AXCore")):
                  return "accessibility (on only under test)"
              if any(r in name(f) for f in samples[0][:8] for r in RUNTIME):
                  return "first use of a screen (Swift type lookups)"
              if any(app_frames(frames) for frames in samples):
                  return "app code"
              return "SwiftUI/UIKit only"

          causes = defaultdict(lambda: [0, 0])
          for s in stalls:
              c = causes[cause(s)]
              c[0] += 1; c[1] += s[0]
          print("by cause (count, total ms):")
          for c, (count, ms) in sorted(causes.items(), key=lambda kv: -kv[1][1]):
              print(f"  {c:<42} {count:>3} {ms:>6}")

          # App functions on the main thread during stalls the harness didn't
          # cause (each function counted once per stall).
          hot = defaultdict(lambda: [0, 0])
          for s in stalls:
              if cause(s).startswith("UI test"):
                  continue
              seen = set()
              for frames in s[4].values():
                  for f in app_frames(frames):
                      if True:
                          n = name(f)
                          n = re.sub(r"\s*\(\S+:\d+\)$", "", n)
                          if n not in seen:
                              seen.add(n); hot[n][0] += 1; hot[n][1] += s[0]
          print("app functions during stalls (stalls, total ms):")
          for n, (count, ms) in sorted(hot.items(), key=lambda kv: -kv[1][1])[:40]:
              print(f"  {count:>3} {ms:>6}  {n[:150]}")

          print("slowest stalls, with the main thread's stack:")
          for s in sorted((s for s in stalls if not cause(s).startswith("UI test")), key=lambda s: -s[0])[:40]:
              ms, at, screen, t, samples = s
              print(f"  -- {ms} ms  {screen}  {t}  [{cause(s)}]")
              for sample_ms, frames in list(samples.items())[:2]:
                  print(f"     sampled at {sample_ms} ms:")
                  shown = 0
                  for f in frames[:6]:
                      print(f"       {f[0][:22]:<22} {name(f)[:150]}")
                      shown += 1
                  app = app_frames(frames[6:])[:8]
                  if app:
                      print("       ...")
                  for f in app:
                      print(f"       {f[0][:22]:<22} {name(f)[:150]}")
          PY

      - name: Export screenshots
        if: always()
        run: |
          set -uo pipefail
          if [ -d build/UITests.xcresult ]; then
            mkdir -p build/attachments build/screenshots
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/attachments || true
            python3 - <<'PY'
          import json, os, re, shutil
          src = "build/attachments"
          dst = "build/screenshots"
          manifest = os.path.join(src, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for attachment in test.get("attachments", []):
                      exported = attachment["exportedFileName"]
                      path = os.path.join(src, exported)
                      # Only the named screenshots; failure diagnostics stay
                      # in the result bundle.
                      if not exported.lower().endswith(".png") or not os.path.exists(path):
                          continue
                      name = attachment.get("suggestedHumanReadableName") or exported
                      base = name.split("_0_")[0] if "_0_" in name else os.path.splitext(name)[0]
                      base = re.sub(r"[^A-Za-z0-9._-]+", "-", base).strip("-") or os.path.splitext(exported)[0]
                      shutil.copy(path, os.path.join(dst, base + ".png"))
          print(sorted(os.listdir(dst)))
          PY
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-screenshots
          path: Forge/build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-logs
          path: |
            Forge/build/*.log
          if-no-files-found: ignore
          retention-days: 7

  screenshot-log:
    # Prints downscaled screenshots as base64 into the job log, so they can
    # be reviewed from environments that can read logs but not download
    # artifacts.
    name: Screenshot log ${{ matrix.group }}
    needs: app
    if: always() && needs.app.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Forge-screenshots
          path: shots
      - name: Print screenshots
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, os
          from PIL import Image
          files = sorted(f for f in os.listdir("shots") if f.lower().endswith(".png")) if os.path.isdir("shots") else []
          group = int(os.environ["GROUP"])
          print(f"{len(files)} screenshots")
          for name in files[group * 7:(group + 1) * 7]:
              image = Image.open(os.path.join("shots", name)).convert("RGB")
              width = 360
              image = image.resize((width, int(image.height * width / image.width)), Image.LANCZOS)
              buffer = io.BytesIO()
              image.save(buffer, "WEBP", quality=60, method=6)
              data = base64.b64encode(buffer.getvalue()).decode()
              print(f"=== BEGIN {name} ===")
              for start in range(0, len(data), 3000):
                  print(data[start:start + 3000])
              print(f"=== END {name} ===")
          PY
