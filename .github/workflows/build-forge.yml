name: Build Forge iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Forge/**"
      - ".github/workflows/build-forge.yml"
  pull_request:
    paths:
      - "Forge/**"
      - ".github/workflows/build-forge.yml"

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Run core tests
        working-directory: Forge
        run: swift test

  app:
    name: Build, UI test and package
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Forge
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Core tests (macOS)
        run: swift test

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set +e
          mkdir -p build
          xcodebuild -project Forge.xcodeproj -scheme Forge \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build \
            > build/device-build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build/device-build.log | sort -u | head -150
          exit $status

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          app="build/device/Build/Products/Release-iphoneos/Forge.app"
          test -f "$app/exercises.json"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$app/Info.plist" | grep -q audio
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$app/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"

      - name: Package IPA
        run: |
          set -euo pipefail
          app="build/device/Build/Products/Release-iphoneos/Forge.app"
          rm -rf build/package && mkdir -p build/package/Payload
          cp -R "$app" build/package/Payload/
          (cd build/package && zip -qry ../../Forge-unsigned.ipa Payload)
          ls -lh Forge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Forge-iPhone-unsigned-IPA
          path: Forge/Forge-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: UI tests in simulator
        id: uitests
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")]
          preferred = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]] or phones
          print(preferred[-1]["udid"])
          ')
          echo "Using simulator $device"
          set +e
          xcodebuild test -project Forge.xcodeproj -scheme Forge \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build/sim -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/uitest.log 2>&1
          status=$?
          grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|XCTAssert" build/uitest.log | head -150
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          set -uo pipefail
          if [ -d build/UITests.xcresult ]; then
            mkdir -p build/attachments build/screenshots
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/attachments || true
            python3 - <<'PY'
          import json, os, shutil
          src = "build/attachments"
          dst = "build/screenshots"
          manifest = os.path.join(src, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for attachment in test.get("attachments", []):
                      name = attachment.get("suggestedHumanReadableName") or attachment.get("exportedFileName")
                      path = os.path.join(src, attachment["exportedFileName"])
                      if os.path.exists(path):
                          base = name.split("_0_")[0] if "_0_" in name else os.path.splitext(name)[0]
                          shutil.copy(path, os.path.join(dst, base + os.path.splitext(path)[1]))
          print(sorted(os.listdir(dst)))
          PY
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-screenshots
          path: Forge/build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-logs
          path: |
            Forge/build/*.log
          if-no-files-found: ignore
          retention-days: 7
