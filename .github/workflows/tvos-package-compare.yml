name: Compare tvOS packages (temporary)
run-name: Compare tvOS packages · ${{ github.ref_name }} · ${{ github.sha }}

# Temporary: the Apple TV's installer stalls on this branch's package and
# takes main's. This builds both the same way the IPA is built and prints how
# the two bundles differ. Removed once the cause is found.
on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build both
        run: |
          set -euo pipefail
          brew install xcodegen >/dev/null
          git worktree add ../old c88b57f
          for side in old new; do
            dir="$GITHUB_WORKSPACE"; [ "$side" = old ] && dir="$GITHUB_WORKSPACE/../old"
            (cd "$dir" && xcodegen generate >/dev/null && xcodebuild -project Lineup.xcodeproj -scheme Lineup \
              -configuration Release -destination 'generic/platform=tvOS' -derivedDataPath "$RUNNER_TEMP/$side" \
              CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS=LINEUP_UNSIGNED_BUILD -quiet)
          done
      - name: Report
        run: |
          set -uo pipefail
          report() {
            app="$RUNNER_TEMP/$1/Build/Products/Release-appletvos/Lineup.app"
            bin="$app/Lineup"
            echo "### $1"
            echo "bundle: $(du -sk "$app" | cut -f1) KB, $(find "$app" -type f | wc -l | tr -d ' ') files"
            echo "binary: $(stat -f %z "$bin") bytes"
            otool -h "$bin" | tail -1
            otool -l "$bin" | awk '/LC_SEGMENT_64/{s=1} s&&/segname/{n=$2} s&&/vmsize/{v=$2} s&&/filesize/{print "  seg", n, "vmsize", v, "filesize", $2; s=0}'
            otool -l "$bin" | grep -A3 LC_CODE_SIGNATURE | tr -s ' ' | paste -sd' ' -
            otool -l "$bin" | awk '/sectname __text/{t=1} t&&/offset/{print "  __text offset", $2; exit}'
            otool -l "$bin" | grep -c "cmd LC_" | sed 's/^/  load commands: /'
            vtool -show-build "$bin" 2>/dev/null | tr -s ' ' | paste -sd' ' -
            codesign -dvvv "$bin" 2>&1 | grep -E "flags|CodeDirectory|Hash type|Page size" | paste -sd' ' -
            otool -L "$bin" | tail -n +2 | sed 's/ (.*//' | sort > "$RUNNER_TEMP/$1.libs"
            (cd "$app" && find . -type f -exec stat -f '%N %z' {} + | sort) > "$RUNNER_TEMP/$1.files"
            plutil -convert xml1 -o "$RUNNER_TEMP/$1.plist" "$app/Info.plist"
          }
          report old; report new
          echo "### linked libraries: old <, new >"; diff "$RUNNER_TEMP/old.libs" "$RUNNER_TEMP/new.libs"
          echo "### Info.plist: old <, new >"; diff "$RUNNER_TEMP/old.plist" "$RUNNER_TEMP/new.plist"
          echo "### files only in one, or a different size: old <, new >"
          diff "$RUNNER_TEMP/old.files" "$RUNNER_TEMP/new.files" | grep '^[<>]' | head -40
          echo "### done"
