# TEMPORARY: renders the redesigned stream list with sample data on Apple TV
# and iPhone, and pushes screenshots to the throwaway branch
# claude/stream-design-snapshots. Removed, with .github/stream-harness,
# before this branch is handed over.
name: Stream design snapshots (temporary)

on:
  push:
    branches: [claude/happy-mayer-dk0war]

permissions:
  contents: write

concurrency:
  group: stream-design-snapshots
  cancel-in-progress: true

jobs:
  snapshots:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check tvOS focus styling
        continue-on-error: true
        run: python3 Tools/check-tv-focus.py | tee "$RUNNER_TEMP/focus-check.txt"

      - name: Install the harness into this checkout only
        run: python3 .github/stream-harness/patch_checkout.py

      - name: Generate project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      # A wide picture for the backdrop, served from the runner: one of the
      # system's desktop pictures, or a drawn gradient if there is none.
      - name: Serve a backdrop
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          picture=$(find "/System/Library/Desktop Pictures" -type f \( -name "*.heic" -o -name "*.jpg" -o -name "*.png" \) 2>/dev/null | head -1)
          if [ -n "$picture" ]; then
            sips -s format jpeg -Z 1920 "$picture" --out "$RUNNER_TEMP/www/backdrop.jpg" >/dev/null || true
          fi
          if [ ! -s "$RUNNER_TEMP/www/backdrop.jpg" ]; then
            python3 - "$RUNNER_TEMP/www/backdrop.png" <<'PY'
          import struct, sys, zlib
          w, h = 1600, 900
          rows = bytearray()
          for y in range(h):
              rows.append(0)
              for x in range(w):
                  rows += bytes((int(30 + 150 * x / w), int(40 + 70 * y / h), int(90 + 110 * (1 - x / w))))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(bytes(rows), 6)) + chunk(b"IEND", b"")
          open(sys.argv[1], "wb").write(png)
          PY
            sips -s format jpeg "$RUNNER_TEMP/www/backdrop.png" --out "$RUNNER_TEMP/www/backdrop.jpg" >/dev/null
          fi
          ls -la "$RUNNER_TEMP/www"
          cd "$RUNNER_TEMP/www"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 1
          curl -sS -o /dev/null -w "backdrop: %{http_code} %{size_download} bytes\n" http://127.0.0.1:8765/backdrop.jpg

      - name: Capture on Apple TV
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          TEST_RUNNER_STREAM_SHOTS_DIR="$RUNNER_TEMP/shots" \
          TEST_RUNNER_STREAM_BACKDROP="http://127.0.0.1:8765/backdrop.jpg" xcodebuild test \
            -project Lineup.xcodeproj \
            -scheme StreamHarness \
            -destination 'platform=tvOS Simulator,name=Apple TV' \
            -derivedDataPath build-harness \
            -resultBundlePath "$RUNNER_TEMP/tv.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG LINEUP_UNSIGNED_BUILD' \
            > "$RUNNER_TEMP/tv.log" 2>&1
          status=$?
          grep -E "error:|Test Case|\*\* " "$RUNNER_TEMP/tv.log" | tail -120 || true
          exit $status

      - name: Capture on iPhone
        continue-on-error: true
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"] and "Pro" in v["name"]))')
          TEST_RUNNER_STREAM_SHOTS_DIR="$RUNNER_TEMP/shots" \
          TEST_RUNNER_STREAM_BACKDROP="http://127.0.0.1:8765/backdrop.jpg" xcodebuild test \
            -project Lineup.xcodeproj \
            -scheme StreamHarnessiOS \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build-harness-ios \
            -resultBundlePath "$RUNNER_TEMP/phone.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG LINEUP_UNSIGNED_BUILD' \
            > "$RUNNER_TEMP/phone.log" 2>&1
          status=$?
          grep -E "error:|Test Case|\*\* " "$RUNNER_TEMP/phone.log" | tail -120 || true
          exit $status

      - name: Collect screenshots and logs
        if: always()
        run: |
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots"
          for bundle in tv phone; do
            [ -d "$RUNNER_TEMP/$bundle.xcresult" ] || continue
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$bundle.xcresult" \
              --output-path "$RUNNER_TEMP/attachments-$bundle" || true
            python3 - "$RUNNER_TEMP/attachments-$bundle" "$shots" <<'PY' || true
          import json, pathlib, shutil, sys
          source, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          manifest = json.loads((source / "manifest.json").read_text())
          for test in manifest:
              for item in test.get("attachments", []):
                  name = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                  name = name.split("_0_")[0]
                  if not name.endswith(".png"):
                      name += ".png"
                  if not (target / name).exists():
                      shutil.copy(source / item["exportedFileName"], target / name)
          PY
          done
          for file in "$shots"/*.png; do
            [ -e "$file" ] || continue
            sips -s format jpeg -s formatOptions 85 "$file" --out "${file%.png}.jpg" >/dev/null && rm "$file"
          done
          for log in tv phone; do
            grep -E "error:|warning:.*(MediaViews|StreamHarness)|Test Case|\*\* " "$RUNNER_TEMP/$log.log" \
              | tail -300 > "$shots/$log-summary.txt" 2>/dev/null || true
            tail -200 "$RUNNER_TEMP/$log.log" > "$shots/$log-tail.txt" 2>/dev/null || true
          done
          cp "$RUNNER_TEMP/focus-check.txt" "$shots/" 2>/dev/null || true
          echo "${GITHUB_SHA}" > "$shots/SOURCE.txt"
          ls -la "$shots"

      - name: Publish to the scratch branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/shots"
          git init -q
          git checkout -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Stream design snapshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/claude/stream-design-snapshots
